
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'dbt_ecommerce'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_ecommerce'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.

models:
  dbt_ecommerce:
    staging:
      +schema: staging
      +materialized: view         # Logical view, recalculated on each query

    intermediate:
      +schema: intermediate
      +materialized: ephemeral    # Inlined as CTE, no physical object created

    marts:
      +schema: marts
      +materialized: table        # Physical table stored in warehouse

# view → stores only the SQL logic as a view; queries are re-executed from the source each time.
# Lightweight and fast for development, but can be slower on large datasets.

# ephemeral → does not create a physical table/view in the warehouse.
# dbt inlines the SQL as a CTE into downstream models.
# Useful for small intermediate transformations.

# table → materializes data as a physical table in the warehouse.
# Faster query performance since results are precomputed,
# but uses storage and requires rebuild/refresh.